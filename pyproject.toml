[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonl-rescue"
version = "1.0.0"
description = "Stream, validate and deduplicate JSONL while preserving rejected records."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Zhengyang Wang"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.scripts]
jsonl-rescue = "jsonl_rescue.cli:main"

[project.urls]
Repository = "https://github.com/Yang1107-wzy/jsonl-rescue"
Issues = "https://github.com/Yang1107-wzy/jsonl-rescue/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
